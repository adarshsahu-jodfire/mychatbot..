
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI - Smart Assistant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0b0d12;--panel:#11141c;--card:#191e29;
--text:#f5f7fc;--muted:#929bad;
--border:#272e3b;--accent:#7967ff;
}
body.light{
--bg:#f5f6fb;--panel:#fff;--card:#f0f1f8;
--text:#171925;--muted:#70778a;
--border:#e1e3ec;--accent:#6755eb;
}
body{
font-family:Inter,sans-serif;background:var(--bg);
color:var(--text);height:100dvh;overflow:hidden;
}
button{font:inherit;cursor:pointer}
.app{display:flex;height:100dvh}
.sidebar{
width:270px;background:var(--panel);
border-right:1px solid var(--border);
padding:20px;display:flex;flex-direction:column;
}
.logo{display:flex;align-items:center;gap:12px;
font-size:21px;font-weight:800;margin-bottom:30px}
.logo-icon{
width:39px;height:39px;border-radius:13px;
background:linear-gradient(135deg,#8977ff,#4938c9);
display:grid;place-items:center;color:white;
}
.newchat{
width:100%;padding:13px;border-radius:12px;
border:1px solid var(--border);background:var(--card);
color:var(--text);font-weight:600;text-align:left;
}
.newchat:hover{border-color:var(--accent)}
.history-title{
font-size:11px;color:var(--muted);
font-weight:700;letter-spacing:1px;margin:28px 0 12px;
}
.history{overflow:auto;flex:1}
.history-item{
padding:11px;border-radius:9px;font-size:13px;
color:var(--muted);white-space:nowrap;
overflow:hidden;text-overflow:ellipsis;
cursor:pointer;margin-bottom:4px;
}
.history-item:hover,.history-item.active{
background:var(--card);color:var(--text)
}
.sidebar-bottom{border-top:1px solid var(--border);padding-top:15px}
.side-btn{
width:100%;padding:12px;border:0;background:transparent;
color:var(--muted);text-align:left;border-radius:9px;
}
.side-btn:hover{background:var(--card);color:var(--text)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
height:65px;border-bottom:1px solid var(--border);
display:flex;align-items:center;justify-content:space-between;
padding:0 25px;background:var(--panel);
}
.top-left{display:flex;align-items:center;gap:12px}
.model{font-weight:700;font-size:14px}
.status{font-size:11px;color:#32c98b;margin-top:4px}
.top-actions{display:flex;gap:10px}
.icon-btn{
width:38px;height:38px;border:1px solid var(--border);
border-radius:11px;background:var(--card);color:var(--text);
}
.mobile-menu{display:none}
.chat-area{
flex:1;overflow-y:auto;padding:35px 18px;
scroll-behavior:smooth;
}
.content{max-width:820px;margin:auto}
.welcome{text-align:center;padding-top:9vh}
.welcome-icon{
width:72px;height:72px;margin:0 auto 22px;
border-radius:23px;display:grid;place-items:center;
font-size:30px;color:white;
background:linear-gradient(135deg,#8774ff,#4735c7);
box-shadow:0 10px 40px #6655ed33;
}
.welcome h1{font-size:35px;font-weight:800;letter-spacing:-1.5px}
.gradient{
background:linear-gradient(90deg,#9c8aff,#54c9ed);
background-clip:text;color:transparent;
}
.welcome p{color:var(--muted);font-size:14px;margin:13px 0 35px}
.suggestions{
display:grid;grid-template-columns:1fr 1fr;gap:12px;
text-align:left;
}
.suggestion{
padding:17px;border:1px solid var(--border);
border-radius:14px;background:var(--panel);
color:var(--text);transition:.2s;
}
.suggestion:hover{border-color:var(--accent);transform:translateY(-2px)}
.suggestion i{color:var(--accent);margin-bottom:12px;font-size:17px}
.suggestion strong{display:block;font-size:13px;margin-bottom:5px}
.suggestion span{font-size:11px;color:var(--muted)}
.message{display:flex;gap:13px;margin-bottom:28px}
.avatar{
width:34px;height:34px;flex-shrink:0;
border-radius:11px;display:grid;place-items:center;
background:var(--card);font-size:14px;
}
.avatar.ai{background:linear-gradient(135deg,#8875ff,#4937c9);color:white}
.msg-body{flex:1;min-width:0;padding-top:7px}
.msg-name{font-size:12px;font-weight:700;margin-bottom:9px}
.msg-text{font-size:14px;line-height:1.8;overflow-wrap:anywhere;white-space:pre-wrap}
.msg-text code{background:var(--card);padding:3px 6px;border-radius:5px}
.msg-text pre{background:var(--panel);border:1px solid var(--border);
padding:14px;border-radius:10px;overflow-x:auto;margin:10px 0}
.msg-text pre code{background:none;padding:0}
.msg-actions{display:flex;gap:10px;margin-top:12px}
.msg-actions button{
background:none;border:0;color:var(--muted);font-size:12px;
}
.msg-actions button:hover{color:var(--accent)}
.typing{display:flex;gap:5px;padding:10px}
.typing span{width:7px;height:7px;background:var(--accent);
border-radius:50%;animation:bounce .8s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{transform:translateY(-7px);opacity:.4}}
.bottom{
padding:15px 18px 20px;
background:var(--bg);
}
.input-wrap{max-width:820px;margin:auto}
.input-box{
display:flex;align-items:flex-end;gap:10px;
padding:12px;border:1px solid var(--border);
border-radius:17px;background:var(--panel);
box-shadow:0 8px 30px #00000012;
}
.input-box:focus-within{border-color:var(--accent)}
textarea{
flex:1;resize:none;max-height:150px;min-height:28px;
border:0;outline:0;background:transparent;
color:var(--text);font:14px Inter,sans-serif;
line-height:1.6;padding:4px;
}
textarea::placeholder{color:var(--muted)}
.send{
width:40px;height:40px;border:0;border-radius:12px;
background:var(--accent);color:white;font-size:16px;
}
.send:disabled{opacity:.5;cursor:not-allowed}
.disclaimer{text-align:center;color:var(--muted);
font-size:10px;margin-top:12px}
.mobile-overlay{display:none}
@media(max-width:700px){
.sidebar{position:fixed;z-index:10;left:-280px;top:0;bottom:0;
transition:.25s}
.sidebar.open{left:0}
.mobile-menu{display:inline-block}
.mobile-overlay.show{display:block;position:fixed;inset:0;
background:#0008;z-index:9}
.topbar{padding:0 13px}
.chat-area{padding:25px 13px}
.welcome{padding-top:7vh}
.welcome h1{font-size:28px}
.suggestions{grid-template-columns:1fr}
.bottom{padding:10px 12px 14px}
}
</style>
</head>

<body>
<div class="mobile-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="logo">
    <div class="logo-icon"><i class="fa-solid fa-sparkles"></i></div>
    NOVA AI
  </div>

  <button class="newchat" onclick="newChat()">
    <i class="fa-solid fa-plus"></i> &nbsp; New Chat
  </button>

  <div class="history-title">RECENT CHATS</div>
  <div class="history" id="history"></div>

  <div class="sidebar-bottom">
    <button class="side-btn" onclick="clearHistory()">
      <i class="fa-regular fa-trash-can"></i> &nbsp; Clear History
    </button>
    <button class="side-btn" onclick="toggleTheme()">
      <i class="fa-solid fa-circle-half-stroke"></i> &nbsp; Change Theme
    </button>
  </div>
</aside>

<main class="main">
<header class="topbar">
  <div class="top-left">
    <button class="icon-btn mobile-menu" onclick="toggleSidebar()">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div>
      <div class="model">Nova AI <i class="fa-solid fa-chevron-down" style="font-size:10px"></i></div>
      <div class="status"><i class="fa-solid fa-circle" style="font-size:7px"></i> AI Assistant</div>
    </div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" title="New chat" onclick="newChat()">
      <i class="fa-solid fa-plus"></i>
    </button>
    <button class="icon-btn" title="Theme" onclick="toggleTheme()">
      <i class="fa-solid fa-moon"></i>
    </button>
  </div>
</header>

<section class="chat-area" id="chatArea">
<div class="content" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <h1>Hello, <span class="gradient">I'm Nova.</span></h1>
    <p>Your intelligent AI assistant. What can I help you with today?</p>

    <div class="suggestions">
      <button class="suggestion" onclick="useSuggestion('Explain Artificial Intelligence in simple Hindi')">
        <i class="fa-solid fa-brain"></i>
        <strong>Learn something</strong>
        <span>Understand any topic easily</span>
      </button>
      <button class="suggestion" onclick="useSuggestion('Write a professional website using HTML and CSS')">
        <i class="fa-solid fa-code"></i>
        <strong>Write code</strong>
        <span>Build websites and projects</span>
      </button>
      <button class="suggestion" onclick="useSuggestion('Give me 5 creative project ideas for students')">
        <i class="fa-solid fa-lightbulb"></i>
        <strong>Get ideas</strong>
        <span>Explore creative possibilities</span>
      </button>
      <button class="suggestion" onclick="useSuggestion('Help me create a study timetable')">
        <i class="fa-solid fa-graduation-cap"></i>
        <strong>Study smarter</strong>
        <span>Learn and prepare for exams</span>
      </button>
    </div>
  </div>
</div>
</section>

<footer class="bottom">
<div class="input-wrap">
  <div class="input-box">
    <textarea id="prompt" rows="1" placeholder="Message Nova AI..." oninput="resizeInput(this)" onkeydown="handleKey(event)"></textarea>
    <button class="send" id="sendBtn" onclick="sendMessage()" title="Send">
      <i class="fa-solid fa-arrow-up"></i>
    </button>
  </div>
  <div class="disclaimer">Nova AI can make mistakes. Verify important information.</div>
</div>
</footer>
</main>
</div>

<script>
const API_URL = "/api/chat";

let chats = [];
let currentChat = [];
let loading = false;

function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("nova-theme",
    document.body.classList.contains("light") ? "light" : "dark");
}

if(localStorage.getItem("nova-theme")==="light"){
  document.body.classList.add("light");
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function resizeInput(el){
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,150)+"px";
}

function handleKey(e){
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

function useSuggestion(text){
  document.getElementById("prompt").value=text;
  sendMessage();
}

function newChat(){
  currentChat=[];
  document.getElementById("messages").innerHTML="";
  showWelcome();
  document.getElementById("prompt").focus();
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

function showWelcome(){
  document.getElementById("messages").innerHTML=`
  <div class="welcome" id="welcome">
    <div class="welcome-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <h1>Hello, <span class="gradient">I'm Nova.</span></h1>
    <p>Your intelligent AI assistant. What can I help you with today?</p>
    <div class="suggestions">
      <button class="suggestion" onclick="useSuggestion('Explain Artificial Intelligence in Hindi')">
        <i class="fa-solid fa-brain"></i><strong>Learn something</strong>
        <span>Understand any topic easily</span>
      </button>
      <button class="suggestion" onclick="useSuggestion('Write HTML website code')">
        <i class="fa-solid fa-code"></i><strong>Write code</strong>
        <span>Build websites and projects</span>
      </button>
    </div>
  </div>`;
}

function escapeHTML(text){
  return String(text).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function formatText(text){
  let safe=escapeHTML(text);
  safe=safe.replace(/```([\s\S]*?)```/g,
    (_,code)=>"<pre><code>"+code.trim()+"</code></pre>");
  safe=safe.replace(/`([^`]+)`/g,"<code>$1</code>");
  safe=safe.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
  safe=safe.replace(/\n/g,"<br>");
  return safe;
}

function addMessage(role,text){
  const container=document.getElementById("messages");
  const welcome=document.getElementById("welcome");
  if(welcome) welcome.remove();

  const id="msg-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);
  const isAI=role==="assistant";

  const div=document.createElement("div");
  div.className="message";
  div.id=id;

  div.innerHTML=`
    <div class="avatar ${isAI?'ai':''}">
      <i class="fa-solid ${isAI?'fa-sparkles':'fa-user'}"></i>
    </div>
    <div class="msg-body">
      <div class="msg-name">${isAI?'Nova AI':'You'}</div>
      <div class="msg-text">${isAI?formatText(text):escapeHTML(text)}</div>
      ${isAI?`<div class="msg-actions">
        <button onclick="copyMessage('${id}')"><i class="fa-regular fa-copy"></i> Copy</button>
      </div>`:''}
    </div>`;

  container.appendChild(div);
  scrollBottom();
  return id;
}

function copyMessage(id){
  const el=document.querySelector("#"+id+" .msg-text");
  if(el) navigator.clipboard.writeText(el.innerText);
}

function scrollBottom(){
  const area=document.getElementById("chatArea");
  area.scrollTop=area.scrollHeight;
}

function showTyping(){
  const div=document.createElement("div");
  div.className="message";
  div.id="typing";
  div.innerHTML=`
    <div class="avatar ai"><i class="fa-solid fa-sparkles"></i></div>
    <div class="msg-body">
      <div class="msg-name">Nova AI</div>
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  document.getElementById("messages").appendChild(div);
  scrollBottom();
}

async function sendMessage(){
  const input=document.getElementById("prompt");
  const text=input.value.trim();
  if(!text || loading) return;

  loading=true;
  document.getElementById("sendBtn").disabled=true;

  input.value="";
  resizeInput(input);

  currentChat.push({role:"user",content:text});
  addMessage("user",text);
  showTyping();

  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:text,
        history:currentChat.slice(-12,-1)
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error || "Server error: "+response.status);
    }

    const answer=data.reply || data.message;

    if(!answer) throw new Error("AI returned an empty response.");

    document.getElementById("typing")?.remove();
    currentChat.push({role:"assistant",content:answer});
    addMessage("assistant",answer);
    saveChat(text);

  }catch(error){
    document.getElementById("typing")?.remove();
    addMessage("assistant",
      "Sorry! Something went wrong.\n\n"+error.message+
      "\n\nPlease check your server and try again.");
  }finally{
    loading=false;
    document.getElementById("sendBtn").disabled=false;
    input.focus();
  }
}

function saveChat(title){
  const id=Date.now();
  chats.unshift({id,title:title.slice(0,35)});
  localStorage.setItem("nova-history",JSON.stringify(chats));
  renderHistory();
}

function renderHistory(){
  const el=document.getElementById("history");
  el.innerHTML="";
  chats.forEach(chat=>{
    const div=document.createElement("div");
    div.className="history-item";
    div.textContent=chat.title;
    el.appendChild(div);
  });
}

function clearHistory(){
  if(!confirm("Clear all chat history?")) return;
  chats=[];
  localStorage.removeItem("nova-history");
  renderHistory();
}

try{
  chats=JSON.parse(localStorage.getItem("nova-history")||"[]");
  if(!Array.isArray(chats)) chats=[];
}catch(e){chats=[]}
renderHistory();
</script>
</body>
</html>
